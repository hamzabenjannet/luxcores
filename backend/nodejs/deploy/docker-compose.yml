# Production stack for one VPS: the API, PostgreSQL, RabbitMQ, Redis and Caddy, which
# terminates TLS with a certificate it fetches and renews by itself.
#
#   cp .env.example .env      # fill in every value
#   docker compose up -d --build
#
# Only Caddy publishes ports. The database and the broker stay on the internal network.
name: luxcores

services:
  api:
    build:
      context: ../../..
      dockerfile: backend/nodejs/Dockerfile
    restart: unless-stopped
    init: true # forwards SIGTERM, so the match runner ends its matches cleanly
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      DATABASE_DRIVER: postgres
      POSTGRES_URL: postgres://luxcores:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/luxcores
      RABBITMQ_URL: amqp://luxcores:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672
      # The server does not read this yet. It is reserved for the planned event cache.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      CORS_ORIGIN: https://${DOMAIN:?set DOMAIN}
      TRUST_PROXY: '1' # one proxy (Caddy) sits in front, so the client address comes from X-Forwarded-For
    # The write-ahead log of every running match lives here, so a restart or a redeploy resumes the matches.
    volumes: [api-data:/app/backend/data]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ['3000']

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxcores
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: luxcores
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luxcores -d luxcores']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    # Verified on Docker Desktop for Mac: the broker needs an explicit user and cookie to start.
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: luxcores
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only persistence, so events that wait in the cache survive a restart of the container.
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep this volume, or Caddy asks for new ones on every start
      - caddy-config:/config
    depends_on: [api]

volumes:
  api-data:
  postgres-data:
  rabbitmq-data:
  redis-data:
  caddy-data:
  caddy-config:
